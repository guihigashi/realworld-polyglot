syntax = "proto3";

package com.github.guihigashi.conduit.feed;

import "google/protobuf/empty.proto";

option go_package = "github.com/guihigashi/conduit/feed/internal/generated/pbfeed;pbfeed";

option php_namespace = "Generated\\Grpc\\Feed";
option php_metadata_namespace = "Generated\\Grpc\\Feed\\Metadata";

service FeedService {
  rpc GetFeed (GetFeedRequest) returns (GetFeedResponse);
  rpc GetTags (google.protobuf.Empty) returns (GetTagsResponse);
  rpc ListArticles (ListArticlesRequest) returns (ListArticlesResponse);
  rpc GetArticle (GetArticleRequest) returns (GetArticleResponse);
  rpc GetComments (GetCommentsRequest) returns (GetCommentsResponse);
}

message GetFeedRequest {
  int32 limit = 1;
  int32 offset = 2;
  optional int64 min_follows_version = 3;
  optional int64 min_favorites_version = 4;
}

message Article {
  string slug = 1;
  string title = 2;
  string description = 3;
  repeated string tag_list = 4;
  string created_at = 5;
  string updated_at = 6;
  bool favorited = 7;
  int32 favorites_count = 8;
  Author author = 9;
  string body = 10;
}

message Author {
  string username = 1;
  string bio = 2;
  string image = 3;
  bool following = 4;
}

message GetFeedResponse {
  repeated Article articles = 1;
  int32 articles_count = 2;
}

message CountedTag {
  string tag = 1;
  int32 count = 2;
}

message GetTagsResponse {
  repeated CountedTag tags = 1;
}

message ListArticlesRequest {
  optional string tag = 1;
  optional string author = 2;
  optional string favorited = 3;
  int32 limit = 4;
  int32 offset = 5;
  optional int64 min_favorites_version = 6;
}

message ListArticlesResponse {
  repeated Article articles = 1;
  int32 articles_count = 2;
}

message GetArticleRequest {
  string slug = 1;
  optional int64 min_favorites_version = 2;
  optional int64 min_follows_version = 3;
}

message GetArticleResponse {
  Article article = 1;
}

message Comment {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  string body = 4;
  Author author = 5;
}

message GetCommentsRequest {
  string slug = 1;
  optional int64 min_follows_version = 2;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
}

