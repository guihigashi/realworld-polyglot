syntax = "proto3";

package com.github.guihigashi.conduit.article;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.github.guihigashi.conduit.article.grpc";

option php_namespace = "Generated\\Grpc\\Article";
option php_metadata_namespace = "Generated\\Grpc\\Article\\Metadata";

service ArticleService {
  rpc ListArticles (ListArticlesRequest) returns (ListArticlesResponse);
  rpc GetArticle (SlugMessage) returns (ArticleResponse);
  rpc CreateArticle (CreateArticleRequest) returns (ArticleResponse);
  rpc UpdateArticle (UpdateArticleRequest) returns (ArticleResponse);
  rpc DeleteArticle (SlugMessage) returns (google.protobuf.Empty);
  rpc FavoriteArticle (SlugMessage) returns (ArticleResponse);
  rpc UnfavoriteArticle (SlugMessage) returns (ArticleResponse);
  rpc GetTags (google.protobuf.Empty) returns (TagListMessage);
}

message ListArticlesRequest {
  optional string tag = 1;
  optional string author_id = 2;
  optional string favorited_by_id = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ArticleSummary {
  string slug = 1;
  string title = 2;
  string description = 3;
  repeated string tag_list = 4;
  string created_at = 5;
  string updated_at = 6;
  bool favorited = 7;
  int32 favorites_count = 8;
  string author_id = 9;
}

message ListArticlesResponse {
  repeated ArticleSummary articles = 1;
}

message SlugMessage {
  string slug = 1;
}

message Article {
  string slug = 1;
  string title = 2;
  string description = 3;
  string body = 4;
  repeated string tag_list = 5;
  string created_at = 6;
  string updated_at = 7;
  bool favorited = 8;
  int32 favorites_count = 9;
  string author_id = 10;
}

message ArticleResponse {
  Article article = 1;
}

message CreateArticleRequest {
  string title = 1;
  string description = 2;
  string body = 3;
  repeated string tag_list = 4;
}

message TagListMessage {
  repeated string tags = 1;
}

message UpdateArticleRequest {
  string slug = 1;
  optional string title = 2;
  optional string description = 3;
  optional string body = 4;
  optional TagListMessage tag_list = 5;
}

