syntax = "proto3";

package com.github.guihigashi.conduit.article;

import "google/protobuf/empty.proto";

option go_package = "github.com/guihigashi/conduit/feed/internal/generated/pbarticle;pbarticle";

option java_multiple_files = true;
option java_package = "com.github.guihigashi.conduit.article.grpc";

option php_namespace = "Generated\\Grpc\\Article";
option php_metadata_namespace = "Generated\\Grpc\\Article\\Metadata";

service ArticleService {
  rpc ListArticles (ListArticlesRequest) returns (ListArticlesResponse);
  rpc GetArticle (GetArticleRequest) returns (ArticleResponse);
  rpc CreateArticle (CreateArticleRequest) returns (ArticleResponse);
  rpc UpdateArticle (UpdateArticleRequest) returns (ArticleResponse);
  rpc DeleteArticle (DeleteArticleRequest) returns (google.protobuf.Empty);
  rpc AddComment (AddCommentRequest) returns (AddCommentResponse);
  rpc GetComments (GetCommentsRequest) returns (GetCommentsResponse);
  rpc DeleteComment (DeleteCommentRequest) returns (google.protobuf.Empty);
  rpc FavoriteArticle (FavoriteArticleRequest) returns (ArticleResponse);
  rpc UnfavoriteArticle (UnfavoriteArticleRequest) returns (ArticleResponse);
  rpc GetTags (google.protobuf.Empty) returns (GetTagsResponse);
  rpc GetArticlesFeed (GetArticlesFeedRequest) returns (ListArticlesResponse);
  rpc UserFavoritedArticles (google.protobuf.Empty) returns (UserFavoritedArticlesResponse);
}

message ListArticlesRequest {
  optional string tag = 1;
  optional string author_id = 2;
  optional string favorited_by_id = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ArticleSummary {
  string slug = 1;
  string title = 2;
  string description = 3;
  repeated string tag_list = 4;
  string created_at = 5;
  string updated_at = 6;
  bool favorited = 7;
  int32 favorites_count = 8;
  string author_id = 9;
}

message ListArticlesResponse {
  repeated ArticleSummary articles = 1;
  int32 total_count = 2;
}

message GetArticleRequest {
  string slug = 1;
}

message Article {
  string slug = 1;
  string title = 2;
  string description = 3;
  string body = 4;
  repeated string tag_list = 5;
  string created_at = 6;
  string updated_at = 7;
  bool favorited = 8;
  int32 favorites_count = 9;
  string author_id = 10;
}

message ArticleResponse {
  Article article = 1;
}

message CreateArticleRequest {
  string title = 1;
  string description = 2;
  string body = 3;
  repeated string tag_list = 4;
}

message TagList {
  repeated string tags = 1;
}

message UpdateArticleRequest {
  string slug = 1;
  optional string title = 2;
  optional string description = 3;
  optional string body = 4;
  optional TagList tag_list = 5;
}

message DeleteArticleRequest {
  string slug = 1;
}

message AddCommentRequest {
  string slug = 1;
  string body = 2;
}

message Comment {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  string body = 4;
  string author_id = 5;
}

message AddCommentResponse {
  Comment comment = 1;
}

message GetCommentsRequest {
  string slug = 1;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
}

message DeleteCommentRequest {
  string slug = 1;
  int64 id = 2;
}

message FavoriteArticleRequest {
  string slug = 1;
}

message UnfavoriteArticleRequest {
  string slug = 1;
}

message GetTagsResponse {
  repeated string tags = 1;
}

message GetArticlesFeedRequest {
  repeated string following_ids = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message UserFavoritedArticlesResponse {
  repeated string articlesIds = 1;
}