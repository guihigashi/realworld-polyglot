services:
  gateway:
    image: localhost/identity-gateway:dev
    build:
      context: ./apps/gateway
      dockerfile: Containerfile
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=realworld
      - DB_USERNAME=realworld
      - DB_PASSWORD=secret
    volumes:
      - ./apps/gateway:/app:z
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: docker.io/library/postgres:18
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=realworld
      - POSTGRES_USER=realworld
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./dev/postgres/initdb.d:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U realworld" ]
      interval: 2s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
