services:
  postgres:
    image: docker.io/library/postgres:18
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=realworld
      - POSTGRES_USER=realworld
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./staging/postgres/initdb.d:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "realworld" ]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: docker.io/library/redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: docker.io/library/rabbitmq:4-management
    hostname: rwa-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=secret
      - RABBITMQ_DEFAULT_VHOST=rwa
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  article-service:
    image: ghcr.io/guihigashi/realworld-polyglot/article-service:latest
    command: --spring.config.location=file:/app/application.yml
    build:
      context: ./apps/article-service
      dockerfile: ./Containerfile
    ports:
      - "9092:9092"
    volumes:
      - ./staging/article-service/application.yml:/app/application.yml:z
    healthcheck:
      test: [ 'CMD', '/bin/grpc-health-probe', '-addr=article-service:9092' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on: &infra_deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  social-graph:
    image: ghcr.io/guihigashi/realworld-polyglot/social-graph:0.1.0-SNAPSHOT
    command: -Dconfig.file=/opt/docker/application.conf
    ports:
      - "9090:9090"
    volumes:
      - ./staging/social-graph/application.conf:/opt/docker/application.conf:z
    healthcheck:
      test: [ 'CMD', '/bin/grpc-health-probe', '-addr=social-graph:9090' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on: *infra_deps
  feed-aggregator:
    image: ghcr.io/guihigashi/realworld-polyglot/feed-aggregator:latest
    build:
      context: ./apps/feed-aggregator
      dockerfile: ./cmd/server/Containerfile
    ports:
      - "9091:9091"
    volumes:
      - ./staging/feed-aggregator/feed-aggregator.yml:/app/feed-aggregator.yml:z
    healthcheck:
      test: [ 'CMD', '/bin/grpc-health-probe', '-addr=feed-aggregator:9091' ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      <<: *infra_deps
      article-service:
        condition: service_healthy
      social-graph:
        condition: service_healthy
  gateway:
    image: ghcr.io/guihigashi/realworld-polyglot/gateway:latest
    command: 'php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000'
    build:
      context: .
      dockerfile: apps/gateway/Containerfile
    ports:
      - "8000:8000"
    volumes:
      - ./staging/gateway/.env:/app/.env:z,ro
      - ./staging/gateway/logs:/app/storage/logs:z
    depends_on:
      <<: *infra_deps
      article-service:
        condition: service_healthy
      social-graph:
        condition: service_healthy
      feed-aggregator:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
